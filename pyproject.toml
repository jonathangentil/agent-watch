[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alethe-tui"
version = "0.1.0"
description = "Monitor local de agentes Alethe, Claude Code e Codex"
requires-python = ">=3.11"
dependencies = ["textual==8.2.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
alethe-tui = "alethe_tui.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/alethe_tui"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
